name: DGER Gen3 Temporary Assurance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact assurance subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind assurance to exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$EXPECTED"
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED"

      - name: Acquire exact uv 0.10.0 artifact
        shell: bash
        run: |
          set -euo pipefail
          UV_ROOT="$RUNNER_TEMP/dger-ci-uv"
          UV_ARCHIVE="$UV_ROOT/uv-x86_64-unknown-linux-gnu.tar.gz"
          UV_DIR="$UV_ROOT/extract"
          UV="$UV_DIR/uv-x86_64-unknown-linux-gnu/uv"
          /bin/mkdir -p "$UV_DIR"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$UV_ARCHIVE" \
            'https://github.com/astral-sh/uv/releases/download/0.10.0/uv-x86_64-unknown-linux-gnu.tar.gz'
          test "$(/usr/bin/sha256sum "$UV_ARCHIVE" | /usr/bin/awk '{print $1}')" = \
            '230e328948c92dd1ebad83949c4d56e83813dfe9c6362a4c519e6a227973f1ae'
          /usr/bin/tar -xzf "$UV_ARCHIVE" -C "$UV_DIR"
          test -f "$UV" && test ! -L "$UV" && test -x "$UV"
          test "$("$UV" --version)" = 'uv 0.10.0'
          printf 'DGER_CI_UV=%s\n' "$UV" >> "$GITHUB_ENV"

      - name: Acquire exact authoritative PyRunway 1.3.1 bytes
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pyrunway-src"
          COMMIT='d717e1336e349c0937a2208d6dff82b7ebc857f2'
          /bin/mkdir -p "$SRC/installers" "$SRC/launcher" "$SRC/contract"
          base="https://raw.githubusercontent.com/billsforAIMe/PyRunway/$COMMIT"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 -o "$SRC/installers/install.sh" "$base/installers/install.sh"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 -o "$SRC/launcher/pyrunway" "$base/launcher/pyrunway"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 -o "$SRC/contract/pyrunway-contract.json" "$base/contract/pyrunway-contract.json"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 -o "$SRC/contract/pyrunway-describe-v1.json" "$base/contract/pyrunway-describe-v1.json"
          test "$(/usr/bin/sha256sum "$SRC/installers/install.sh" | /usr/bin/awk '{print $1}')" = 'c2d83b30c2e13ffea56a59e50e71ba6f3f75a5c11e7c600338906c49e69e0e00'
          test "$(/usr/bin/sha256sum "$SRC/launcher/pyrunway" | /usr/bin/awk '{print $1}')" = 'b2942061c6634001d2ffe9bcd66790e45c08bc0091b2f1c5bce530aa0f5a9883'
          test "$(/usr/bin/sha256sum "$SRC/contract/pyrunway-contract.json" | /usr/bin/awk '{print $1}')" = '7695601e69633a865d3e711d9c0b2ad3534372b185c797a96704d2e7f512823a'
          test "$(/usr/bin/sha256sum "$SRC/contract/pyrunway-describe-v1.json" | /usr/bin/awk '{print $1}')" = '3cac6569f0ed27b1bf98c551f3a155091a20fcc3302ea3c9680f10cce3c6aed2'
          /bin/chmod 755 "$SRC/installers/install.sh" "$SRC/launcher/pyrunway"
          printf 'DGER_PYRUNWAY_SRC=%s\n' "$SRC" >> "$GITHUB_ENV"

      - name: Bind exact governed PyRunway
        shell: bash
        run: |
          set -euo pipefail
          PY='/usr/bin/python3'
          test -n "$DGER_CI_UV" && test -x "$DGER_CI_UV"
          test -n "$DGER_PYRUNWAY_SRC"
          test -x "$PY"
          "$DGER_PYRUNWAY_SRC/installers/install.sh" --prefix "$RUNNER_TEMP/pyrunway" --uv "$DGER_CI_UV" --python "$PY"
          "$RUNNER_TEMP/pyrunway/bin/pyrunway" --contract | /usr/bin/grep -F '"release_version": "1.3.1"'

      - name: Generation 3 semantic assurance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pyrunway/bin/pyrunway" --standalone tests/run_gen3_assurance.py

      - name: Repository-wide regression
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pyrunway/bin/pyrunway" --standalone tests/run_all.py
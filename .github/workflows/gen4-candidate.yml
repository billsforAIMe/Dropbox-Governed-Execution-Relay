name: DGER Gen4 candidate regression

on:
  push:
    branches:
      - builder/dger-gen4-fixed-dispatcher
      - assurance/gen4-runtime-composition-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python surfaces
        run: python -m compileall -q src tests tools
      - name: Portable Gen3 + Gen4 assurance and release validation
        env:
          PYTHONPATH: src:tests
        run: python tests/run_gen4_assurance.py
